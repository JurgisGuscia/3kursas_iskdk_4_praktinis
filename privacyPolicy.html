<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet" type="text/css">
    <title>DRIVELEASE</title>
</head>
<body>
    <div id="backDrop" class="backDrop hideBackDrop"></div>
    <div id="gameWindow" class="gameWindow off">
        <div class="controlRow">
            <div id="newGameButton" class="newGameButton"><img src="./icons/mine.png" rel="mine"></div>
            <div id="closeGame" class="closeGame"><img src="./icons/X.png" rel="x"></div>
        </div>
        <div id="gameField" class="gameField">
            
        </div>
        <div id="gameOverScreen" class="gameOverScreen hidden">PRALAIMĖJAI!</div>
        <div id="winScreen" class="gameOverScreen hidden">LAIMĖJAI!</div>
    </div>
    <nav id="navbar"></nav>
    <header id="header"></header>
    <div id="whyUsWrapper" class="whyUsWrapper"></div>
    <div id="controlButtonWrapper" class="controlButtonWrapper"></div>
    <div id="bodyWrapper" class="bodyWrapper">
        <div class="bodyContentWrapper">
            <div id="privacyPolicyContent" class="privacyPolicyContent"></div>
        </div>
        <div class="bodySidebar">
            <div id="calculatorWrapper" class="calculatorWrapper"></div> 
            <div id="contactUsDash" class="contactUsDash"></div>
            <div id="whyUsDash" class="whyUsDash"> </div>
            <div id="newsLetterWrapper" class="newsLetterWrapper"></div>
        </div>
    </div>
    <footer id="footer"> </footer>
    <script type="module" src="./js/modules.js"></script>
    <script type="module" src="./js/privacyPolicyModules.js"></script>
    <script src="./js/game.js" defer></script>
    <script src="./js/events.js"  defer></script>

</body>
</html>
